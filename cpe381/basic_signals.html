<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basic Signals | CPE 381</title>

<!-- Bricolage Grotesque. The face is also distributed at https://bestfreefonts.com/bricolage-grotesque -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23183e4b'/%3E%3Cpath d='M6 34c6-22 12 18 18-4s12 12 16 2 10-8 18-8' fill='none' stroke='%23fcf1ef' stroke-width='4.5' stroke-linecap='round'/%3E%3Cpath d='M32 54V14' stroke='%23d74a49' stroke-width='4.5' stroke-linecap='round'/%3E%3Cpath d='M32 10l5 8h-10z' fill='%23d74a49'/%3E%3C/svg%3E">

<style>
:root{
  --ink:#183e4b; --deep:#1b4552; --accent:#d74a49; --muted:#8ba0a4;
  --rule:#ced3d7; --sand:#e8d8c9; --paper:#fcf1ef; --mist:#eaeaea;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--mist);color:var(--ink);
  font-family:'Bricolage Grotesque',Verdana,Geneva,sans-serif;
  font-optical-sizing:auto;font-variant-numeric:tabular-nums;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.shell{max-width:1220px;margin:0 auto;padding:22px 20px 0}

header{display:flex;align-items:flex-end;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-size:clamp(22px,3.2vw,32px);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.05}
.sub{margin:3px 0 0;font-size:13.5px;color:var(--deep);max-width:56ch}
.course{margin:0 0 3px auto;font-size:13px;color:var(--deep);font-weight:600}

.layout{display:grid;grid-template-columns:292px minmax(0,1fr);gap:20px;margin-top:20px}
@media (max-width:920px){.layout{grid-template-columns:1fr}}

.panel{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:15px 15px 17px}
.panel + .panel{margin-top:14px}
.panel h2{font-size:12.5px;font-weight:700;margin:0 0 10px;color:var(--deep)}

.views{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.view{
  width:100%;display:flex;align-items:center;gap:10px;cursor:pointer;
  font:inherit;font-size:13.5px;font-weight:600;text-align:left;
  background:transparent;color:var(--ink);border:1px solid transparent;border-radius:10px;padding:8px 10px;
  transition:background .15s,border-color .15s,color .15s;
}
.view:hover{background:var(--mist)}
.view .n{
  flex:none;width:22px;height:22px;border-radius:6px;background:var(--mist);border:1px solid var(--rule);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--deep);
}
.view[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.view[aria-pressed="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--paper)}

.sl{margin-bottom:12px}
.sl:last-child{margin-bottom:0}
.sl .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sl .nm{font-size:13px;font-weight:600;color:var(--deep)}
.sl .vl{font-size:16px;font-weight:700;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 0;height:22px}
.hint{font-size:12.5px;color:var(--deep);margin:8px 0 0}
.bar{display:flex;align-items:center;gap:10px}
.play{font:inherit;font-size:13px;font-weight:700;cursor:pointer;flex:none;background:var(--accent);color:var(--paper);border:none;border-radius:999px;padding:7px 16px}
.play:hover{background:#c23f3e}
.reset{font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;background:transparent;color:var(--deep);border:1px solid var(--rule);border-radius:999px;padding:6px 13px;margin-top:10px}
.reset:hover{border-color:var(--muted)}

.stage{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:16px 16px 12px;min-width:0}
.eq{font-size:clamp(17px,2.3vw,23px);font-weight:700;letter-spacing:-.01em;margin:0 0 2px;color:var(--ink)}
.eq b{color:var(--accent)}
.eqsub{margin:0 0 12px;font-size:12.5px;color:var(--muted);font-weight:600}
.plot{position:relative;width:100%;aspect-ratio:16/9;min-height:300px;max-height:62vh}
canvas{display:block;width:100%;height:100%;border-radius:10px;touch-action:none}
.readout{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{font-size:12.5px;font-weight:600;background:var(--mist);border:1px solid var(--rule);border-radius:999px;padding:4px 11px;color:var(--deep)}
.pill b{color:var(--accent);font-weight:700}
.note{margin:12px 0 0;padding:12px 14px;background:var(--mist);border-left:3px solid var(--sand);border-radius:0 10px 10px 0;font-size:13.5px;max-width:78ch}
.note strong{color:var(--accent);font-weight:700}

footer{
  max-width:1220px;margin:26px auto 0;padding:14px 20px 24px;border-top:1px solid var(--rule);
  font-size:12.5px;color:var(--deep);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
footer span:last-child{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
</style>
</head>
<body>

<div class="shell">
  <header>
    <svg width="42" height="42" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#183e4b"/>
      <path d="M6 34c6-22 12 18 18-4s12 12 16 2 10-8 18-8" fill="none" stroke="#fcf1ef" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M32 54V14" stroke="#d74a49" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M32 10l5 8h-10z" fill="#d74a49"/>
    </svg>
    <div>
      <h1>Basic signals</h1>
      <p class="sub">Complex exponentials, real exponentials, sinusoids, and the limit that defines the unit impulse.</p>
    </div>
    <p class="course">Signals and Systems</p>
  </header>

  <div class="layout">
    <aside>
      <div class="panel">
        <h2>Topic</h2>
        <ul class="views" id="views"></ul>
      </div>
      <div class="panel">
        <h2>Parameters</h2>
        <div id="sliders"></div>
      </div>
      <div class="panel">
        <h2>Animation</h2>
        <div class="bar">
          <button class="play" id="play" aria-pressed="true">Pause</button>
          <input type="range" id="scrub" min="0" max="1" step="0.002" value="0" aria-label="Animation position">
        </div>
        <p class="hint" id="ahint"></p>
        <button class="reset" id="reset">Reset parameters</button>
      </div>
    </aside>

    <section class="stage">
      <p class="eq" id="eq"></p>
      <p class="eqsub" id="eqsub"></p>
      <div class="plot" id="plotWrap"><canvas id="cv"></canvas></div>
      <div class="readout" id="readout"></div>
      <p class="note" id="note"></p>
    </section>
  </div>
</div>

<footer>
  <span>CPE 381: Transformations on Signals.</span>
  <span>Space starts and stops the animation. Keys 1 to 5 change the topic.</span>
</footer>

<script>
(function(){
'use strict';

var C = { ink:'#183e4b', deep:'#1b4552', accent:'#d74a49', muted:'#8ba0a4',
          rule:'#ced3d7', sand:'#e8d8c9', paper:'#fcf1ef', mist:'#eaeaea' };
var FONT = '"Bricolage Grotesque", Verdana, sans-serif';
var TWO_PI = 2*Math.PI;

var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 800, H = 450;

/* Drawing helpers */
function font(w, s){ ctx.font = w + ' ' + s + 'px ' + FONT; }

function Ax(x, y, w, h, t0, t1, v0, v1, title){
  return { x:x, y:y, w:w, h:h, t0:t0, t1:t1, v0:v0, v1:v1, title:title,
    X:function(t){ return this.x + (t-this.t0)/(this.t1-this.t0)*this.w; },
    Y:function(v){ return this.y + this.h - (v-this.v0)/(this.v1-this.v0)*this.h; } };
}

function niceStep(raw){
  var e = Math.pow(10, Math.floor(Math.log(raw)/Math.LN10)), f = raw/e;
  if(f < 1.5) return e;
  if(f < 3) return 2*e;
  if(f < 7) return 5*e;
  return 10*e;
}
function fmt(v, step){
  var d = step >= 1 ? 0 : (step >= 0.1 ? 1 : 2);
  var s = v.toFixed(d);
  return s === '-0' || s === '-0.0' || s === '-0.00' ? s.slice(1) : s;
}
function clipAx(ax){ ctx.save(); ctx.beginPath(); ctx.rect(ax.x, ax.y, ax.w, ax.h); ctx.clip(); }

function arrow(x1, y1, x2, y2, color, w, head){
  var a = Math.atan2(y2-y1, x2-x1);
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - head*Math.cos(a-0.42), y2 - head*Math.sin(a-0.42));
  ctx.lineTo(x2 - head*Math.cos(a+0.42), y2 - head*Math.sin(a+0.42));
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}

function frameAx(ax, xlab, ylab){
  var sx = niceStep((ax.t1-ax.t0)/6), sy = niceStep((ax.v1-ax.v0)/5), g, zy, zx;
  clipAx(ax);
  ctx.strokeStyle = C.rule; ctx.lineWidth = 1; ctx.globalAlpha = 0.9;
  ctx.beginPath();
  for(g = Math.ceil(ax.t0/sx)*sx; g <= ax.t1; g += sx){ ctx.moveTo(Math.round(ax.X(g))+0.5, ax.y); ctx.lineTo(Math.round(ax.X(g))+0.5, ax.y+ax.h); }
  for(g = Math.ceil(ax.v0/sy)*sy; g <= ax.v1; g += sy){ ctx.moveTo(ax.x, Math.round(ax.Y(g))+0.5); ctx.lineTo(ax.x+ax.w, Math.round(ax.Y(g))+0.5); }
  ctx.stroke(); ctx.globalAlpha = 1;

  zy = (ax.v0 < 0 && ax.v1 > 0) ? ax.Y(0) : ax.y + ax.h - 0.5;
  zx = (ax.t0 < 0 && ax.t1 > 0) ? ax.X(0) : ax.x + 0.5;
  arrow(ax.x, zy, ax.x + ax.w - 2, zy, C.ink, 1.6, 6);
  arrow(zx, ax.y + ax.h, zx, ax.y + 3, C.ink, 1.6, 6);

  ctx.fillStyle = C.deep; font(600, 10.5);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for(g = Math.ceil(ax.t0/sx)*sx; g <= ax.t1; g += sx){
    if(Math.abs(g) < sx/100) continue;
    ctx.fillText(fmt(g, sx), ax.X(g), zy + 5);
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for(g = Math.ceil(ax.v0/sy)*sy; g <= ax.v1; g += sy){
    if(Math.abs(g) < sy/100) continue;
    ctx.fillText(fmt(g, sy), zx - 5, ax.Y(g));
  }
  if(xlab){ ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; font(700, 11.5); ctx.fillText(xlab, ax.x+ax.w-6, zy - 5); }
  if(ylab){ ctx.textAlign = 'left'; ctx.textBaseline = 'top'; font(700, 11.5); ctx.fillText(ylab, zx + 6, ax.y + 4); }
  ctx.restore();

  ctx.strokeStyle = C.rule; ctx.lineWidth = 1;
  ctx.strokeRect(ax.x+0.5, ax.y+0.5, ax.w-1, ax.h-1);
  if(ax.title){
    ctx.fillStyle = C.deep; font(700, 12); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(ax.title, ax.x + 9, ax.y + 8);
  }
}

function plot(ax, fn, color, width, dash, alpha, n){
  var i, t, first = true, N = n || 700, yv;
  clipAx(ax);
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath();
  for(i=0;i<=N;i++){
    t = ax.t0 + (ax.t1-ax.t0)*i/N;
    yv = fn(t);
    if(!isFinite(yv)){ first = true; continue; }
    yv = Math.max(ax.v0 - 3*(ax.v1-ax.v0), Math.min(ax.v1 + 3*(ax.v1-ax.v0), yv));
    if(first){ ctx.moveTo(ax.X(t), ax.Y(yv)); first = false; }
    else ctx.lineTo(ax.X(t), ax.Y(yv));
  }
  ctx.stroke();
  ctx.restore();
}

function shade(ax, fn, ta, tb, alpha, n){
  var i, t, N = n || 300;
  if(tb <= ta) return;
  clipAx(ax);
  ctx.globalAlpha = alpha; ctx.fillStyle = C.accent;
  ctx.beginPath(); ctx.moveTo(ax.X(ta), ax.Y(0));
  for(i=0;i<=N;i++){ t = ta + (tb-ta)*i/N; ctx.lineTo(ax.X(t), ax.Y(fn(t))); }
  ctx.lineTo(ax.X(tb), ax.Y(0)); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function dot(ax, t, v, color, r){
  clipAx(ax);
  ctx.beginPath(); ctx.arc(ax.X(t), ax.Y(v), r, 0, TWO_PI);
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = C.paper; ctx.stroke();
  ctx.restore();
}

function cursor(ax, t){
  clipAx(ax);
  ctx.save(); ctx.setLineDash([3,4]); ctx.strokeStyle = C.deep; ctx.globalAlpha = 0.6; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(ax.X(t), ax.y); ctx.lineTo(ax.X(t), ax.y+ax.h); ctx.stroke();
  ctx.restore(); ctx.restore();
}

function tag(text, x, y, bg){
  ctx.save(); font(700, 11.5);
  var w = ctx.measureText(text).width + 14;
  ctx.fillStyle = bg || C.sand; ctx.strokeStyle = C.rule; ctx.lineWidth = 1;
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x, y, w, 20, 6); ctx.fill(); ctx.stroke(); }
  else { ctx.fillRect(x, y, w, 20); ctx.strokeRect(x, y, w, 20); }
  ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x+7, y+10.5);
  ctx.restore();
}

/* Topics */
var VIEWS = [
{
  id:'cexp', name:'Complex exponential', aspect:'16/9', period:8, scrub:'Time cursor t',
  sliders:[
    {k:'A', lab:'|A|', min:0.2, max:2, step:0.05, def:1},
    {k:'th', lab:'&theta; (rad)', min:-3.14, max:3.14, step:0.02, def:0},
    {k:'r', lab:'r (1/s)', min:-0.7, max:0.05, step:0.01, def:-0.22},
    {k:'Om', lab:'&Omega;<sub>0</sub> (rad/s)', min:0.5, max:8, step:0.05, def:3}
  ],
  eq:function(p){
    return 'x(t) = <b>' + p.A.toFixed(2) + '</b> e<sup>' + p.r.toFixed(2) + 't</sup> [ cos(' +
           p.Om.toFixed(2) + 't ' + (p.th<0?'- ':'+ ') + Math.abs(p.th).toFixed(2) + ') + j sin(' +
           p.Om.toFixed(2) + 't ' + (p.th<0?'- ':'+ ') + Math.abs(p.th).toFixed(2) + ') ]';
  },
  eqsub:function(p){
    return 'a = r + j\u03A90 = ' + p.r.toFixed(2) + (p.Om<0?' - j':' + j') + Math.abs(p.Om).toFixed(2) +
           ', A = |A| e^(j\u03B8) with |A| = ' + p.A.toFixed(2) + ' and \u03B8 = ' + p.th.toFixed(2) + ' rad';
  },
  readout:function(p, ph){
    var m = p.A*Math.exp(p.r*ph), re = m*Math.cos(p.Om*ph+p.th), im = m*Math.sin(p.Om*ph+p.th);
    return '<span class="pill">t = <b>' + ph.toFixed(2) + ' s</b></span>' +
           '<span class="pill">|x(t)| = <b>' + m.toFixed(3) + '</b></span>' +
           '<span class="pill">Re x(t) = <b>' + re.toFixed(3) + '</b></span>' +
           '<span class="pill">Im x(t) = <b>' + im.toFixed(3) + '</b></span>';
  },
  note:'The factor e<sup>rt</sup> sets the magnitude and the angle advances at the rate &Omega;<sub>0</sub>. ' +
       'On the complex plane the point follows a spiral, and the two projections are the cosine and the sine terms. ' +
       'With r = 0 the spiral closes into a circle of radius |A|. ' +
       '<strong>The signal is complex valued, so no instrument measures it.</strong> It is used because differentiation of e<sup>at</sup> is multiplication by a.',
  draw:function(p, ph){
    var tMax = 8, M = 3;
    var gap = 16, S = Math.min(H-12, W*0.42);
    var pa = Ax(8, (H-S)/2, S, S, -M, M, -M, M, 'complex plane');
    var rw = W - S - gap - 16, rh = (H - 12 - gap)/2;
    var pb = Ax(8+S+gap, 6, rw, rh, 0, tMax, -M, M, 'Re x(t)');
    var pc = Ax(8+S+gap, 6+rh+gap, rw, rh, 0, tMax, -M, M, 'Im x(t)');
    var env = function(t){ return p.A*Math.exp(p.r*t); };
    var re = function(t){ return env(t)*Math.cos(p.Om*t+p.th); };
    var im = function(t){ return env(t)*Math.sin(p.Om*t+p.th); };

    frameAx(pa, 'Re', 'Im'); frameAx(pb, 't (s)', ''); frameAx(pc, 't (s)', '');

    /* spiral */
    var i, t, N = 900;
    clipAx(pa);
    ctx.strokeStyle = C.muted; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.55;
    ctx.beginPath();
    for(i=0;i<=N;i++){ t = tMax*i/N; if(i===0) ctx.moveTo(pa.X(re(t)), pa.Y(im(t))); else ctx.lineTo(pa.X(re(t)), pa.Y(im(t))); }
    ctx.stroke();
    ctx.globalAlpha = 1; ctx.strokeStyle = C.accent; ctx.lineWidth = 2.6;
    ctx.beginPath();
    N = Math.max(2, Math.round(900*ph/tMax));
    for(i=0;i<=N;i++){ t = ph*i/N; if(i===0) ctx.moveTo(pa.X(re(t)), pa.Y(im(t))); else ctx.lineTo(pa.X(re(t)), pa.Y(im(t))); }
    ctx.stroke();
    ctx.setLineDash([3,4]); ctx.strokeStyle = C.muted; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(pa.X(0), pa.Y(0), Math.abs(pa.X(env(ph))-pa.X(0)), 0, TWO_PI); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    arrow(pa.X(0), pa.Y(0), pa.X(re(ph)), pa.Y(im(ph)), C.ink, 2, 8);
    dot(pa, re(ph), im(ph), C.accent, 5);

    plot(pb, env, C.muted, 1.4, [5,4], 0.9); plot(pb, function(t){ return -env(t); }, C.muted, 1.4, [5,4], 0.9);
    plot(pc, env, C.muted, 1.4, [5,4], 0.9); plot(pc, function(t){ return -env(t); }, C.muted, 1.4, [5,4], 0.9);
    plot(pb, re, C.accent, 2.6); plot(pc, im, C.accent, 2.6);
    cursor(pb, ph); cursor(pc, ph);
    dot(pb, ph, re(ph), C.accent, 4.5); dot(pc, ph, im(ph), C.accent, 4.5);
    tag('envelope  |A| e^(rt)', pb.x + 10, pb.y + pb.h - 28);
  }
},
{
  id:'rexp', name:'Decay and growth', aspect:'16/9', period:6, scrub:'Time cursor t',
  sliders:[
    {k:'A', lab:'A', min:0.2, max:2, step:0.05, def:1},
    {k:'r', lab:'r (1/s)', min:-1.5, max:1.5, step:0.01, def:-0.7}
  ],
  eq:function(p){ return 'x(t) = <b>' + p.A.toFixed(2) + '</b> e<sup>' + p.r.toFixed(2) + ' t</sup>'; },
  eqsub:function(p){
    if(Math.abs(p.r) < 0.02) return 'r is near zero, so the signal is nearly constant at A';
    return (p.r<0 ? 'r < 0, decaying. ' : 'r > 0, growing. ') + 'Time constant 1/|r| = ' + (1/Math.abs(p.r)).toFixed(2) + ' s';
  },
  readout:function(p, ph){
    var t = -1 + ph, v = p.A*Math.exp(p.r*t), T = 1/Math.abs(p.r);
    return '<span class="pill">t = <b>' + t.toFixed(2) + ' s</b></span>' +
           '<span class="pill">x(t) = <b>' + v.toFixed(3) + '</b></span>' +
           '<span class="pill">x(T)/A = <b>' + (Math.abs(p.r)<0.02 ? '1.000' : Math.exp(p.r*T).toFixed(3)) + '</b></span>' +
           '<span class="pill">x(5T)/A = <b>' + (Math.abs(p.r)<0.02 ? '1.000' : Math.exp(5*p.r*T).toFixed(4)) + '</b></span>';
  },
  note:'With r &lt; 0 the signal decreases and with r &gt; 0 it increases without bound. ' +
       'The quantity 1/|r| is the time constant, marked on the plot. ' +
       'After one time constant a decaying exponential holds 0.368 of its initial value, and after five it holds 0.0067. ' +
       '<strong>The growing case is a model and not a physical source</strong>, since any real device saturates or fails.',
  draw:function(p, ph){
    var ax = Ax(8, 6, W-16, H-12, -1, 5, -0.3, 4, 'x(t) = A e^(rt)');
    var f = function(t){ return p.A*Math.exp(p.r*t); };
    var g = function(t){ return p.A*Math.exp(-p.r*t); };
    frameAx(ax, 't (s)', 'x');
    plot(ax, g, C.muted, 1.6, [5,4], 0.75);
    plot(ax, f, C.accent, 3);
    var t = -1 + ph;
    cursor(ax, t); dot(ax, t, f(t), C.accent, 5);
    if(Math.abs(p.r) > 0.02){
      var T = 1/Math.abs(p.r), vT = f(T);
      clipAx(ax);
      ctx.save(); ctx.setLineDash([4,4]); ctx.strokeStyle = C.ink; ctx.globalAlpha = 0.7; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(ax.X(T), ax.Y(0)); ctx.lineTo(ax.X(T), ax.Y(vT));
      ctx.lineTo(ax.X(ax.t0), ax.Y(vT));
      ctx.stroke(); ctx.restore(); ctx.restore();
      dot(ax, T, vT, C.ink, 4);
      tag('t = 1/|r| = ' + T.toFixed(2) + ' s', Math.min(W-150, ax.X(T)+8), ax.Y(0)-26);
      tag('x = ' + vT.toFixed(3), 14, Math.max(8, ax.Y(vT)-26));
    }
    tag('dashed curve: the same |r| with the opposite sign', ax.x+10, ax.y+ax.h-30);
  }
},
{
  id:'sine', name:'Sinusoid, general form', aspect:'16/9', period:4, scrub:'Time cursor t',
  sliders:[
    {k:'A', lab:'A', min:0.2, max:2, step:0.05, def:1.2},
    {k:'f0', lab:'f<sub>0</sub> (Hz)', min:0.3, max:2, step:0.01, def:0.6},
    {k:'th', lab:'&theta; (rad)', min:-3.14, max:3.14, step:0.02, def:0.8}
  ],
  eq:function(p){
    var om = TWO_PI*p.f0;
    return 'x(t) = <b>' + p.A.toFixed(2) + '</b> cos(' + om.toFixed(2) + 't ' + (p.th<0?'- ':'+ ') + Math.abs(p.th).toFixed(2) + ')';
  },
  eqsub:function(p){
    var om = TWO_PI*p.f0;
    return 'equals ' + p.A.toFixed(2) + ' sin(' + om.toFixed(2) + 't ' + (p.th<0?'- ':'+ ') + Math.abs(p.th).toFixed(2) +
           ' + \u03C0/2).   \u03A90 = 2\u03C0f0 = ' + om.toFixed(2) + ' rad/s,  T0 = 2\u03C0/\u03A90 = ' + (1/p.f0).toFixed(3) + ' s';
  },
  readout:function(p, ph){
    var om = TWO_PI*p.f0, i, d = 0, t, a, b;
    for(i=0;i<=400;i++){
      t = -0.5 + 4.5*i/400;
      a = p.A*Math.cos(om*t+p.th); b = p.A*Math.sin(om*t+p.th+Math.PI/2);
      d = Math.max(d, Math.abs(a-b));
    }
    return '<span class="pill">t = <b>' + ph.toFixed(2) + ' s</b></span>' +
           '<span class="pill">x(t) = <b>' + (p.A*Math.cos(om*ph+p.th)).toFixed(3) + '</b></span>' +
           '<span class="pill">T<sub>0</sub> = <b>' + (1/p.f0).toFixed(3) + ' s</b></span>' +
           '<span class="pill">largest cosine minus sine difference = <b>' + d.toExponential(1) + '</b></span>';
  },
  note:'The cosine form and the sine form describe one signal. The sine version carries an extra &pi;/2 in its phase, which is the content of equation 1.16. ' +
       'The period T<sub>0</sub> = 2&pi;/&Omega;<sub>0</sub> depends on frequency alone, so A and &theta; leave it unchanged. ' +
       '<strong>The last reading is a numerical check of the identity</strong> over the window, and it reports the largest difference between the two forms.',
  draw:function(p, ph){
    var om = TWO_PI*p.f0, T0 = 1/p.f0, A = p.A;
    var ax = Ax(8, 6, W-16, H-12, -0.5, 4, -2.9, 2.9, 'A cos(\u03A90 t + \u03B8) and A sin(\u03A90 t + \u03B8 + \u03C0/2)');
    frameAx(ax, 't (s)', 'x');
    plot(ax, function(t){ return A*Math.cos(om*t+p.th); }, C.accent, 3);
    plot(ax, function(t){ return A*Math.sin(om*t+p.th+Math.PI/2); }, C.ink, 1.6, [6,5], 0.95);
    var tm = -p.th/om;
    tm = tm - Math.floor(tm/T0)*T0;
    var yb = A*1.22;
    clipAx(ax);
    ctx.strokeStyle = C.deep; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(ax.X(tm), ax.Y(yb)); ctx.lineTo(ax.X(tm+T0), ax.Y(yb));
    ctx.moveTo(ax.X(tm), ax.Y(yb-0.07*A)); ctx.lineTo(ax.X(tm), ax.Y(yb+0.07*A));
    ctx.moveTo(ax.X(tm+T0), ax.Y(yb-0.07*A)); ctx.lineTo(ax.X(tm+T0), ax.Y(yb+0.07*A));
    ctx.stroke();
    ctx.save(); ctx.setLineDash([3,4]); ctx.globalAlpha = 0.7; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(ax.X(tm), ax.Y(0)); ctx.lineTo(ax.X(tm), ax.Y(A)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax.x, ax.Y(A)); ctx.lineTo(ax.X(tm), ax.Y(A)); ctx.stroke();
    ctx.restore(); ctx.restore();
    tag('T0 = ' + T0.toFixed(3) + ' s', Math.min(W-130, ax.X(tm) + (ax.X(T0)-ax.X(0))/2 - 40), ax.Y(yb) - 26);
    tag('A = ' + A.toFixed(2), 14, ax.Y(A) - 26);
    arrow(ax.X(0), ax.Y(-A*1.2), ax.X(tm), ax.Y(-A*1.2), C.accent, 1.8, 7);
    tag('first maximum at t = ' + tm.toFixed(3) + ' s', ax.X(0) + 6, ax.Y(-A*1.2) + 6);
    cursor(ax, ph); dot(ax, ph, A*Math.cos(om*ph+p.th), C.accent, 5);
  }
},
{
  id:'delta', name:'Pulse to unit impulse', aspect:'16/8', period:10, scrub:'Sweep of \u0394',
  sliders:[ {k:'D', lab:'&Delta; (s)', min:0.04, max:2, step:0.01, def:1} ],
  drive:function(p, ph, per){
    p.D = 0.04 + (2-0.04)*(1+Math.cos(TWO_PI*ph/per))/2;
  },
  invert:function(p, per){
    var c = 2*(p.D - 0.04)/(2-0.04) - 1;
    return per*Math.acos(Math.max(-1, Math.min(1, c)))/TWO_PI;
  },
  eq:function(p){
    return 'p<sub>&Delta;</sub>(t) = 1/&Delta; = <b>' + (1/p.D).toFixed(2) + '</b> for |t| &le; &Delta;/2, and 0 outside, with &Delta; = <b>' + p.D.toFixed(3) + ' s</b>';
  },
  eqsub:function(){ return 'u\u0394(t) is the integral of p\u0394(t). As \u0394 approaches 0 the pair approaches \u03B4(t) and u(t).'; },
  readout:function(p){
    return '<span class="pill">height 1/&Delta; = <b>' + (1/p.D).toFixed(2) + '</b></span>' +
           '<span class="pill">width &Delta; = <b>' + p.D.toFixed(3) + '</b></span>' +
           '<span class="pill">area = <b>' + (p.D*(1/p.D)).toFixed(2) + '</b></span>' +
           '<span class="pill">u<sub>&Delta;</sub>(0) = <b>0.50</b></span>';
  },
  note:'The height is 1/&Delta; and the width is &Delta;, so the area equals unity at every value of &Delta;. ' +
       'As &Delta; decreases the pulse narrows and the integral approaches the unit step. ' +
       'The limit &delta;(t) is drawn as an arrow because its value at the origin is not defined, and the number in parentheses is the area rather than the height. ' +
       '<strong>&delta;(t) is not a function in the ordinary sense.</strong> The limit is meaningful under an integral sign, and the pointwise limit at t = 0 does not exist.',
  draw:function(p){
    var gap = 18, w = (W - gap - 16)/2, D = p.D, h = 1/D;
    var pa = Ax(8, 6, w, H-12, -1.5, 1.5, -0.35, 4.3, 'p\u0394(t) and the limit \u03B4(t)');
    var pb = Ax(8+w+gap, 6, w, H-12, -1.5, 1.5, -0.35, 1.5, 'u\u0394(t) and the limit u(t)');
    frameAx(pa, 't (s)', ''); frameAx(pb, 't (s)', '');

    /* limit objects drawn faintly as the target */
    ctx.save(); ctx.globalAlpha = 0.28;
    arrow(pa.X(0), pa.Y(0), pa.X(0), pa.Y(4.0), C.accent, 3, 9);
    ctx.restore();
    clipAx(pb); ctx.save(); ctx.globalAlpha = 0.28; ctx.strokeStyle = C.accent; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(pb.X(-1.5), pb.Y(0)); ctx.lineTo(pb.X(0), pb.Y(0));
    ctx.moveTo(pb.X(0), pb.Y(1)); ctx.lineTo(pb.X(1.5), pb.Y(1)); ctx.stroke();
    ctx.restore(); ctx.restore();

    var pf = function(t){ return (t >= -D/2 && t <= D/2) ? h : 0; };
    var uf = function(t){ return t < -D/2 ? 0 : (t > D/2 ? 1 : (t + D/2)/D); };
    shade(pa, pf, -D/2 - 0.001, D/2 + 0.001, 0.16, 120);
    plot(pa, pf, C.ink, 2.6, null, 1, 1600);
    plot(pb, uf, C.ink, 2.6, null, 1, 1200);

    clipAx(pa);
    ctx.save(); ctx.setLineDash([3,4]); ctx.strokeStyle = C.muted; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(pa.x, pa.Y(Math.min(h, 4.2))); ctx.lineTo(pa.X(0), pa.Y(Math.min(h, 4.2))); ctx.stroke();
    ctx.restore(); ctx.restore();
    if(h <= 4.1) tag('1/\u0394 = ' + h.toFixed(2), pa.x + 10, pa.Y(h) - 26);
    else tag('(1) area, height beyond the panel', pa.X(0) + 10, pa.Y(4.0) - 4);
    dot(pb, 0, 0.5, C.accent, 4.5);
    tag('u\u0394(0) = 0.5', pb.X(0) + 10, pb.Y(0.5) - 10);
    tag('\u0394 = ' + D.toFixed(3) + ' s', pa.x + 10, pa.y + pa.h - 30);
    tag('area = 1.00', pa.X(0) + 10, pa.Y(0) - 28, C.mist);
  }
},
{
  id:'rel', name:'Impulse, step and ramp', aspect:'16/11', period:4, scrub:'Time cursor t',
  sliders:[],
  eq:function(){ return 'u(t) = &int;<sub>-&infin;</sub><sup>t</sup> &delta;(&tau;) d&tau;,   &delta;(t) = du(t)/dt,   r(t) = &int;<sub>-&infin;</sub><sup>t</sup> u(&tau;) d&tau; = t u(t)'; },
  eqsub:function(){ return 'Equations 1.23 to 1.25, with the ramp added as the next integral.'; },
  readout:function(p, ph){
    var t = -1 + ph, uv = t > 0 ? 1 : 0, rv = t > 0 ? t : 0;
    return '<span class="pill">t = <b>' + t.toFixed(2) + ' s</b></span>' +
           '<span class="pill">&int;&delta; = u(t) = <b>' + uv.toFixed(2) + '</b></span>' +
           '<span class="pill">&int;u = r(t) = <b>' + rv.toFixed(2) + '</b></span>';
  },
  note:'The unit step is the running integral of the impulse, and the impulse is the derivative of the step. ' +
       'One further integration gives the ramp r(t) = t u(t). ' +
       'The shaded area in each row is the accumulated integral to the left of the cursor, and the dot in the row below reports that area. ' +
       '<strong>The jump of u(t) at the origin has no derivative in the classical sense</strong>, which is the reason &delta;(t) is defined by its integral.',
  draw:function(p, ph){
    var t = -1 + ph, gap = 14, h = (H - 2*gap - 12)/3;
    var a1 = Ax(8, 6, W-16, h, -1, 3, -0.3, 1.45, '\u03B4(t)');
    var a2 = Ax(8, 6+h+gap, W-16, h, -1, 3, -0.3, 1.45, 'u(t), the integral of \u03B4');
    var a3 = Ax(8, 6+2*(h+gap), W-16, h, -1, 3, -0.6, 2.9, 'r(t) = t u(t), the integral of u');
    frameAx(a1, 't (s)', ''); frameAx(a2, 't (s)', ''); frameAx(a3, 't (s)', '');

    var uf = function(x){ return x > 0 ? 1 : 0; };
    var rf = function(x){ return x > 0 ? x : 0; };

    arrow(a1.X(0), a1.Y(0), a1.X(0), a1.Y(1), t > 0 ? C.accent : C.muted, 3, 9);
    tag('(1)', a1.X(0) + 9, a1.Y(1) - 4);
    plot(a2, uf, C.ink, 2.2, null, 0.55, 1200);
    plot(a3, rf, C.ink, 2.2, null, 0.55, 600);
    shade(a2, uf, -1, Math.max(-1, Math.min(t, 3)), 0.18, 200);
    clipAx(a2);
    ctx.strokeStyle = C.accent; ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(a2.X(-1), a2.Y(0)); ctx.lineTo(a2.X(Math.min(t, 0)), a2.Y(0));
    if(t > 0){ ctx.moveTo(a2.X(0), a2.Y(1)); ctx.lineTo(a2.X(t), a2.Y(1)); }
    ctx.stroke(); ctx.restore();
    clipAx(a3);
    ctx.strokeStyle = C.accent; ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(a3.X(-1), a3.Y(0)); ctx.lineTo(a3.X(Math.min(t, 0)), a3.Y(0));
    if(t > 0) ctx.lineTo(a3.X(t), a3.Y(t));
    ctx.stroke(); ctx.restore();

    cursor(a1, t); cursor(a2, t); cursor(a3, t);
    dot(a2, t, uf(t), C.accent, 5);
    dot(a3, t, rf(t), C.accent, 5);
    tag('area so far = ' + (t>0?t:0).toFixed(2), a3.x + 10, a3.y + 34);
  }
}
];

/* State */
var vi = 0, phase = 0, playing = true, manual = false, state = {};
VIEWS.forEach(function(v){
  var o = {};
  v.sliders.forEach(function(s){ o[s.k] = s.def; });
  state[v.id] = o;
});

var viewsEl = document.getElementById('views'), slidersEl = document.getElementById('sliders');
var eqEl = document.getElementById('eq'), eqsubEl = document.getElementById('eqsub');
var noteEl = document.getElementById('note'), readEl = document.getElementById('readout');
var scrubEl = document.getElementById('scrub'), playEl = document.getElementById('play');
var ahintEl = document.getElementById('ahint'), resetEl = document.getElementById('reset');
var wrapEl = document.getElementById('plotWrap');
var inputs = {};

VIEWS.forEach(function(v, i){
  var li = document.createElement('li'), b = document.createElement('button');
  b.className = 'view'; b.type = 'button';
  b.innerHTML = '<span class="n">' + (i+1) + '</span>' + v.name;
  b.setAttribute('aria-pressed', i===0 ? 'true' : 'false');
  b.addEventListener('click', function(){ setView(i); });
  li.appendChild(b); viewsEl.appendChild(li);
});

function setView(i){
  vi = i; phase = 0; manual = false;
  var v = VIEWS[i], k;
  var btns = viewsEl.querySelectorAll('.view');
  for(k=0;k<btns.length;k++) btns[k].setAttribute('aria-pressed', k===i ? 'true':'false');
  wrapEl.style.aspectRatio = v.aspect;
  slidersEl.innerHTML = ''; inputs = {};
  if(!v.sliders.length){
    slidersEl.innerHTML = '<p class="hint">This topic has no free parameter. The three signals are fixed by definition.</p>';
  }
  v.sliders.forEach(function(s){
    var d = document.createElement('div'); d.className = 'sl';
    d.innerHTML = '<div class="row"><span class="nm">' + s.lab + '</span><span class="vl"></span></div>';
    var inp = document.createElement('input');
    inp.type = 'range'; inp.min = s.min; inp.max = s.max; inp.step = s.step;
    inp.value = state[v.id][s.k];
    inp.setAttribute('aria-label', s.lab.replace(/<[^>]+>/g, ''));
    inp.addEventListener('input', function(){
      state[v.id][s.k] = parseFloat(inp.value);
      if(v.drive){
        manual = true;
        if(playing) toggle();
        if(v.invert){ phase = v.invert(state[v.id], v.period); scrubEl.value = String(phase); }
      }
      syncText();
    });
    d.appendChild(inp); slidersEl.appendChild(d);
    inputs[s.k] = { input:inp, out:d.querySelector('.vl'), s:s };
  });
  scrubEl.min = 0; scrubEl.max = v.period; scrubEl.step = v.period/500;
  scrubEl.setAttribute('aria-label', v.scrub);
  ahintEl.textContent = v.drive
    ? 'The slider sweeps \u0394 down toward zero and back. Moving the \u0394 slider above stops the sweep, and Play resumes it.'
    : 'The slider moves the time cursor through the window.';
  resize(); syncText();
}

function syncText(){
  var v = VIEWS[vi], p = state[v.id];
  eqEl.innerHTML = v.eq(p);
  eqsubEl.textContent = v.eqsub(p);
  noteEl.innerHTML = v.note;
  var k;
  for(k in inputs){
    if(inputs.hasOwnProperty(k)){
      inputs[k].out.textContent = p[k].toFixed(2);
      if(parseFloat(inputs[k].input.value) !== p[k]) inputs[k].input.value = p[k];
    }
  }
}

var lastRead = '', lastEq = '';
function syncLive(){
  var v = VIEWS[vi], p = state[v.id];
  var r = v.readout(p, phase);
  if(r !== lastRead){ readEl.innerHTML = r; lastRead = r; }
  if(v.drive && !manual){
    var e = v.eq(p);
    if(e !== lastEq){ eqEl.innerHTML = e; lastEq = e; }
    eqsubEl.textContent = v.eqsub(p);
    for(var k in inputs){ if(inputs.hasOwnProperty(k)){
      inputs[k].out.textContent = p[k].toFixed(3);
      inputs[k].input.value = p[k];
    } }
  }
}

function toggle(){
  playing = !playing;
  if(playing) manual = false;
  playEl.textContent = playing ? 'Pause' : 'Play';
  playEl.setAttribute('aria-pressed', playing ? 'true' : 'false');
}
playEl.addEventListener('click', toggle);
scrubEl.addEventListener('input', function(){
  phase = parseFloat(scrubEl.value);
  manual = false;
  if(playing) toggle();
});
resetEl.addEventListener('click', function(){
  var v = VIEWS[vi];
  v.sliders.forEach(function(s){ state[v.id][s.k] = s.def; });
  phase = 0; scrubEl.value = 0; setView(vi);
});
document.addEventListener('keydown', function(e){
  if(e.key === ' '){ e.preventDefault(); toggle(); return; }
  var n = parseInt(e.key, 10);
  if(n >= 1 && n <= VIEWS.length) setView(n-1);
});

function resize(){
  var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = Math.max(300, Math.round(r.width)); H = Math.max(240, Math.round(r.height));
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

var last = 0;
function loop(ts){
  var v = VIEWS[vi], p = state[v.id];
  if(!last) last = ts;
  var dt = Math.min(0.05, (ts - last)/1000); last = ts;
  if(playing){
    phase = (phase + dt) % v.period;
    scrubEl.value = String(phase);
  }
  if(v.drive && !manual) v.drive(p, phase, v.period);
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  v.draw(p, phase);
  syncLive();
  requestAnimationFrame(loop);
}

setView(0);
resize();
if(window.ResizeObserver) new ResizeObserver(resize).observe(wrapEl);
window.addEventListener('resize', resize);
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
