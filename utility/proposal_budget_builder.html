<meta name="theme-color" content="#0D0D0D">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  /* Layout: sticky header, step rail, a horizontal track of sliding panels on the left, a sticky live ledger on the right. */
  --bg:#FAFAFA;
  --panel:#FFFFFF;
  --ink:#0D0D0D;
  --ink-2:#4F4C45;
  --ink-3:#736F66;
  --line:#E6E2D9;
  --line-2:#D5CFC2;
  --gold:#CFAE70;
  --gold-deep:#86693A;
  --gold-wash:#F7F1E3;
  --field:#FCFCFB;
  --soft:#F5F4F0;
  --warn:#9A5B00;
  --bad:#B3261E;
  --good:#2F7A4E;
  --display:"Michroma","Eurostile","Microgramma",ui-sans-serif,sans-serif;
  --body:"Saira","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --ease:cubic-bezier(.66,0,.18,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--bg);
  background-image:linear-gradient(rgba(13,13,13,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(13,13,13,.022) 1px,transparent 1px);
  background-size:44px 44px;
  color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button{font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;align-items:center}
.gap{gap:10px}
.wrap{flex-wrap:wrap}
.mt{margin-top:16px}
.muted{color:var(--ink-3)}

/* Header */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:20px;padding:12px 24px;background:rgba(250,250,250,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.brand-mark{width:38px;height:38px;flex:none;border-radius:10px;box-shadow:0 6px 14px -8px rgba(13,13,13,.45)}
.brand-name{font-family:var(--display);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;line-height:1.3}
.brand-sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.top-prop{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.top-title{font-weight:600;font-size:14.5px;max-width:520px;overflow-wrap:anywhere;line-height:1.3}
.save-state{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:flex;gap:7px;align-items:center}
.save-state i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.save-state.off i{background:var(--bad)}
.top-actions{display:flex;gap:8px;flex:none}

/* Step rail */
.rail{max-width:1380px;margin:0 auto;padding:22px 24px 4px;overflow-x:auto}
.rail ol{list-style:none;margin:0;padding:0 0 6px;display:grid;grid-template-columns:repeat(var(--n,12),minmax(74px,1fr));position:relative;min-width:1000px}
.rail ol::before{content:"";position:absolute;left:calc(100% / (2 * var(--n,12)));right:calc(100% / (2 * var(--n,12)));top:14px;height:1px;background:var(--line-2)}
.rail ol::after{content:"";position:absolute;left:calc(100% / (2 * var(--n,12)));top:13.5px;height:2px;background:var(--gold);width:calc((100% - 100% / var(--n,12)) * var(--p,0));transition:width .75s var(--ease)}
.rail li{position:relative;z-index:1;display:flex;justify-content:center}
.rail button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 4px;text-align:center}
.rail .node{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);background:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);transition:background .4s,border-color .4s,box-shadow .4s,color .4s}
.rail .lbl{font-size:12px;color:var(--ink-2);line-height:1.2}
.rail li.done .node{border-color:var(--gold);color:var(--gold-deep);background:#fff}
.rail li.active .node{border-color:var(--gold);background:var(--gold);color:var(--ink);box-shadow:0 0 0 5px var(--gold-wash)}
.rail li.active .lbl{color:var(--ink);font-weight:600}
.rail button:hover .node{border-color:var(--gold)}
.rail button:focus-visible .node{outline:2px solid var(--ink);outline-offset:3px}

/* Stage */
.stage{max-width:1380px;margin:0 auto;padding:18px 24px 40px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}
.main-col{min-width:0}
.viewport{position:relative;overflow:hidden;transition:height .5s var(--ease)}
.track{display:flex;align-items:flex-start;transition:transform .75s var(--ease);will-change:transform}
.slide{flex:0 0 100%;min-width:0;padding:4px}
.viewport::after{content:"";position:absolute;top:0;bottom:0;width:2px;left:-6px;background:linear-gradient(transparent,var(--gold) 18%,var(--gold) 82%,transparent);box-shadow:0 0 22px 3px rgba(207,174,112,.55);opacity:0;pointer-events:none}
.viewport.sweep-f::after{animation:sweepF .75s var(--ease)}
.viewport.sweep-b::after{animation:sweepB .75s var(--ease)}
@keyframes sweepF{0%{left:100%;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:0;opacity:0}}
@keyframes sweepB{0%{left:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:100%;opacity:0}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 36px 32px;box-shadow:0 1px 0 rgba(13,13,13,.03),0 22px 44px -32px rgba(13,13,13,.22)}
.slide.arrive .p-head>*{animation:rise .6s var(--ease) both}
.slide.arrive .p-head>*:nth-child(2){animation-delay:.06s}
.slide.arrive .p-head>*:nth-child(3){animation-delay:.12s}
@keyframes rise{from{transform:translateY(8px);opacity:.35}to{transform:none;opacity:1}}

.p-head{padding-bottom:22px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.p-code{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);display:flex;gap:10px;align-items:center;margin:0}
.p-code::before{content:"";width:22px;height:1px;background:var(--gold)}
.p-title{font-family:var(--display);font-weight:400;font-size:clamp(19px,2.3vw,26px);letter-spacing:.02em;line-height:1.3;margin:12px 0 8px;text-wrap:balance}
.p-title:focus{outline:none}
.p-lede{color:var(--ink-2);max-width:68ch;margin:0}

/* Hero */
.hero{display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;align-items:center;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:8px}
.core{width:250px;height:250px;display:block}
.hero-h{font-size:clamp(22px,3vw,34px);margin:12px 0 12px}

/* Groups */
.grp{margin-top:28px}
.grp.first{margin-top:0}
.grp-h{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 14px;display:flex;align-items:center;gap:12px}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}
.grp-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.grp-bar .grp-h{flex:1;margin:0;min-width:200px}

/* Fields */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
.fgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fgrid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld.span2{grid-column:span 2}
.fld-l{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.req{font-weight:500;color:var(--gold-deep);text-transform:none;letter-spacing:0;margin-left:7px;font-size:11.5px}
.inp{position:relative;display:flex;align-items:center;border:1px solid var(--line-2);border-radius:11px;background:var(--field);transition:border-color .2s,box-shadow .2s,background .2s;min-height:44px}
.inp:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(207,174,112,.3);background:#fff}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:10px 12px;outline:none}
.inp textarea{resize:vertical;min-height:76px}
.inp input.n{font-family:var(--mono);font-size:14.5px}
.inp .pre,.inp .suf{font-family:var(--mono);font-size:13px;color:var(--ink-3)}
.inp .pre{padding-left:12px}
.inp .suf{padding-right:12px}
.inp .pre+input{padding-left:6px}
.inp.sel select{appearance:none;-webkit-appearance:none;padding-right:34px;cursor:pointer}
.inp.sel::after{content:"";position:absolute;right:15px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--ink-2);border-bottom:1.5px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.fld-h{font-size:12.5px;color:var(--ink-3);line-height:1.45;margin:0}
.fld.invalid .inp{border-color:var(--bad);box-shadow:0 0 0 3px rgba(179,38,30,.12)}
.fld.invalid .fld-l{color:var(--bad)}
.outbox{min-height:44px;display:flex;align-items:center;padding:0 12px;border-radius:11px;background:var(--soft);font-family:var(--mono);font-weight:600;font-size:14.5px}

/* Toggles */
.togs{display:flex;flex-wrap:wrap;gap:12px 22px;padding-top:4px}
.tog{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14.5px;user-select:none}
.tog input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.tog-t{width:38px;height:22px;border-radius:999px;background:#ECE9E2;border:1px solid var(--line-2);position:relative;transition:background .25s,border-color .25s;flex:none}
.tog-t::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.22);transition:transform .25s var(--ease)}
.tog input:checked+.tog-t{background:var(--gold);border-color:var(--gold)}
.tog input:checked+.tog-t::after{transform:translateX(16px)}
.tog input:focus-visible+.tog-t{outline:2px solid var(--ink);outline-offset:2px}
.tog.locked{cursor:default}
.tog.locked .tog-l::after{content:" · always";color:var(--ink-3);font-size:12.5px}

/* Cards */
.stack{display:flex;flex-direction:column;gap:16px}
.card{border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px;background:#fff;position:relative}
.card::before{content:"";position:absolute;left:-1px;top:22px;width:3px;height:22px;border-radius:0 3px 3px 0;background:var(--gold)}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-foot{display:flex;align-items:center;gap:12px;margin-top:14px}
.card-sum{margin-left:auto;font-size:13px;color:var(--ink-2)}
.card-sum b{font-family:var(--mono);color:var(--ink);font-weight:600;margin-left:6px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold-deep);border-radius:999px;padding:3px 10px;background:var(--gold-wash);white-space:nowrap}
.chip[data-state="Equipment"]{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.inp.mini{min-height:34px;border-radius:999px}
.inp.mini select{padding:5px 30px 5px 12px;font-size:13px;font-weight:600}
.inp.mini::after{right:12px}

/* Effort grids */
.grid-wrap{overflow-x:auto;margin-top:16px;border:1px solid var(--line);border-radius:12px}
table.eg{border-collapse:collapse;width:100%;min-width:max-content;font-size:13.5px}
.eg th,.eg td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.eg tr:last-child th,.eg tr:last-child td{border-bottom:0}
.eg thead th{background:var(--soft);font-weight:600;font-size:12px;color:var(--ink-2);vertical-align:bottom}
.eg th[scope=row]{text-align:left;font-weight:500;color:var(--ink-2);position:sticky;left:0;background:#fff;z-index:1}
.eg thead th:first-child{position:sticky;left:0;z-index:2}
.eg .yk{display:block;font-family:var(--mono);color:var(--ink)}
.eg .yd{display:block;font-weight:400;font-size:11px;color:var(--ink-3)}
.eg tr.o td{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.eg tr.o.sub td{color:var(--ink-3)}
.eg tr.o.first th,.eg tr.o.first td{border-top:1px solid var(--line-2)}
.cell-inp{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:8px;background:var(--field);width:96px;transition:border-color .2s,box-shadow .2s}
.cell-inp:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(207,174,112,.3);background:#fff}
.cell-inp input{width:100%;min-width:0;border:0;background:transparent;font-family:var(--mono);font-size:13.5px;padding:6px 4px 6px 8px;text-align:right;outline:none;color:var(--ink)}
.cell-inp i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-right:8px}
.cell-inp i.pre{padding:0 0 0 8px}
.cell-inp.w-yr{width:84px}
.cell-inp.w-m{width:124px}

/* Buttons */
.btn{font-weight:600;font-size:14px;border-radius:12px;border:1px solid var(--line-2);background:#fff;color:var(--ink);padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .2s,background .2s,transform .2s;line-height:1.2}
.btn:hover{border-color:var(--gold)}
.btn:focus-visible,.icon-btn:focus-visible,.link-btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.primary{background:var(--ink);color:#FAFAFA;border-color:var(--ink)}
.btn.primary:hover{background:#262522}
.btn .arw{color:var(--gold);transition:transform .25s var(--ease)}
.btn.primary:hover .arw{transform:translateX(4px)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.gold:hover{background:#C6A363}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.add-btn{width:100%;justify-content:center;border:1px dashed var(--gold);background:transparent;color:var(--gold-deep);padding:14px}
.btn.add-btn:hover{background:var(--gold-wash)}
.add-row{display:flex;gap:12px;margin-top:16px}
.add-row .add-btn{margin:0}
.icon-btn{background:none;border:0;padding:6px 4px;font-size:12.5px;font-weight:600;color:var(--ink-3);cursor:pointer;border-radius:6px}
.icon-btn:hover{color:var(--bad)}
.icon-btn.neutral:hover{color:var(--gold-deep)}
.link-btn{background:none;border:0;padding:8px 0 0;color:var(--gold-deep);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Notes and strips */
.note{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:14px;background:var(--soft);font-size:14px;color:var(--ink-2)}
.note p{margin:0;max-width:72ch}
.note.gold{background:var(--gold-wash);border:1px solid #EADCBB}
.note b{color:var(--ink)}
.brk{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;padding:12px 14px;background:var(--soft);border-radius:12px;font-size:13px;color:var(--ink-2)}
.brk b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.brk .em b{color:var(--gold-deep)}
.empty{padding:22px;border:1px dashed var(--line-2);border-radius:14px;color:var(--ink-3);text-align:center;margin:0}
.quote-link{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--gold-deep)}
.quote-link[hidden]{display:none}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.tile{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:var(--mono);font-size:19px;font-weight:600;margin-top:2px}

/* Summary metadata and rule box */
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 20px;margin:12px 0 0}
.meta div{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px;font-size:13px}
.meta dt{color:var(--ink-3)}
.meta dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.rulebox{border:1px solid var(--line);border-radius:16px;padding:16px 18px 18px;margin-bottom:18px;background:var(--soft)}
.rulebox .grp-h{margin-bottom:12px}

/* PI salary entry mode */
.moderow{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:end;margin-top:16px}
.moderow .fld-h{padding-bottom:12px}
@media (max-width:640px){ .moderow{grid-template-columns:minmax(0,1fr)} .moderow .fld-h{padding-bottom:0} }

/* Total rows */
.eg tr.o.tot th,.eg tr.o.tot td{font-weight:700;color:var(--ink);border-top:1px solid var(--line-2);background:var(--gold-wash)}
.eg tr.o.tot th[scope=row]{background:var(--gold-wash)}
.sec-cap{caption-side:top;text-align:left;padding:10px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);background:var(--soft);border-bottom:1px solid var(--line)}
table.tb td,table.tb th{white-space:nowrap}
table.tb thead th:first-child{text-align:left}
table.tb th[scope=row] .yd{display:block;font-size:11px;color:var(--ink-3);font-weight:400}

/* Term calendar summary */
.calsum{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;font-size:13.5px}

/* Summer period */
.pair{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px}
.season{margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-radius:14px}
.sm-strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.sm-c{position:relative;height:30px;background:var(--soft);border-radius:6px;overflow:hidden}
.sm-f{position:absolute;top:0;bottom:0;background:var(--gold)}
.sm-l{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.sm-txt{margin:10px 0 0;font-size:13.5px;color:var(--ink-2);max-width:78ch}
.sm-txt b{color:var(--ink)}
.sm-txt b.bad{color:var(--bad)}

/* Periods */
.periods{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.periods li{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px}
.periods .pk{font-family:var(--mono);font-weight:600;color:var(--gold-deep)}
.periods .pm{font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}

/* Library */
.lib{display:grid;gap:10px}
.lib-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:18px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
.lib-row.cur{border-color:var(--gold);background:var(--gold-wash)}
.lib-t{font-weight:600;overflow-wrap:anywhere}
.lib-m{font-size:12.5px;color:var(--ink-3)}
.lib-amt{font-family:var(--mono);font-weight:600;text-align:right}
.lib-amt small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}
.lib-act{display:flex;gap:2px}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep);margin-left:8px}

/* Tuition */
table.tt{border-collapse:collapse;width:100%;min-width:max-content;font-size:13.5px}
.tt th,.tt td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tt thead th{background:var(--soft);font-size:12px;font-weight:600;color:var(--ink-2)}
.tt th:first-child,.tt td:first-child{text-align:left}
.tt td[data-fmt]{font-family:var(--mono)}
.tt .tgrp{border-left:1px solid var(--line-2)}
details.verify{margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:4px 16px}
details.verify summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14px}
details.verify summary::marker{color:var(--gold)}
table.tg{border-collapse:collapse;font-size:12px;min-width:max-content;width:100%}
.tg th,.tg td{padding:4px 8px;text-align:right;font-family:var(--mono);white-space:nowrap}
.tg thead th{color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--line-2)}
.tg tbody th{text-align:left;color:var(--ink);border-top:1px solid var(--line)}
.tg tr.t td{border-top:1px solid var(--line)}
.tg tr.i td{color:var(--gold-deep)}
.tg td.na{background:repeating-linear-gradient(135deg,#F3F1EC 0 4px,#fff 4px 8px)}

/* Navbar */
.navbar{position:sticky;bottom:0;z-index:20;margin-top:14px;display:flex;align-items:center;gap:14px;padding:16px 4px 14px;background:linear-gradient(rgba(250,250,250,0),var(--bg) 34%)}
.nav-mid{flex:1;text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:2px}
.nav-mid b{color:var(--ink);font-weight:600}
.kbd{font-size:11px;color:var(--ink-3)}

/* Ledger */
.ledger{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
.lg-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 22px}
.lg-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lg-k{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:0}
.lg-status{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.lg-status i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(47,122,78,.14)}
.lg-status.warn{color:var(--warn)}
.lg-status.warn i{background:var(--warn);box-shadow:0 0 0 3px rgba(154,91,0,.14)}
.lg-cap{margin:16px 0 0;font-size:13px;color:var(--ink-2)}
.lg-total{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.01em;margin:2px 0 4px;font-variant-numeric:tabular-nums;line-height:1.15}
.lg-split{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.lg-split b{font-family:var(--mono);color:var(--ink);font-weight:600}
.lg-years{display:grid;gap:9px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.ybar{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.yb-k{font-family:var(--mono);color:var(--ink-3)}
.yb-t{height:8px;border-radius:4px;background:#F0EEE9;overflow:hidden}
.yb-f{display:block;height:100%;background:var(--gold);border-radius:4px;transition:width .5s var(--ease)}
.yb-v{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.lg-cats{margin:12px 0 0;display:grid;gap:7px}
.lg-cats div{display:grid;grid-template-columns:minmax(0,1fr) auto 42px;gap:10px;font-size:13px;align-items:baseline}
.lg-cats dt{color:var(--ink-2)}
.lg-cats dd{margin:0;font-family:var(--mono);text-align:right}
.lg-cats dd.p{color:var(--ink-3);font-size:11.5px}
.lg-empty{margin:0;font-size:13px;color:var(--ink-3)}
.adv ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.adv li{font-size:13px;color:var(--ink-2);display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px}
.adv li::before{content:"!";width:16px;height:16px;border-radius:50%;background:var(--warn);color:#fff;font-family:var(--mono);font-size:10.5px;font-weight:600;display:grid;place-items:center;margin-top:2px}

/* Summary */
.sum-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.sum-head h3{font-size:19px;margin:0 0 4px;font-weight:600;overflow-wrap:anywhere}
.sum-head p{margin:0;font-size:13.5px;color:var(--ink-2)}
.rate-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rate-chips span{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;color:var(--ink-2);background:#fff}
.sum-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table.sum{border-collapse:collapse;width:100%;min-width:max-content;font-size:13.5px}
.sum th,.sum td{padding:8px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.sum .l{text-align:left;position:sticky;left:0;z-index:1}
.sum thead th{background:var(--ink);color:#FAFAFA;font-weight:600;vertical-align:bottom}
.sum thead .yd{display:block;color:var(--gold);font-family:var(--mono);font-size:11px;font-weight:400}
.sum tbody tr{background:#fff}
.sum tbody td.l{background:inherit}
.sum td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sum td.tc{border-left:1px solid var(--line-2);font-weight:600}
.sum tr.sec td{background:var(--gold-wash);color:var(--gold-deep);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding-top:10px}
.sum tr.ln td.l{padding-left:28px;color:var(--ink-2)}
.sum tr.sub td{font-weight:600;border-top:1px solid var(--line-2)}
.sum tr.tot td{font-weight:700;border-top:2px solid var(--gold);background:var(--gold-wash)}
.sum tr.neg td{color:var(--ink-3);font-style:italic}
.sum tr.neg td.l{padding-left:28px}
.sum tr.grand td{background:var(--ink);color:#FAFAFA;font-weight:700;font-size:14.5px;border-bottom:0}
.sum tr.grand td.num{color:var(--gold)}
.sum tr.cum td{color:var(--ink-3);font-size:12.5px}
.assume{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--ink-2);font-size:14px;max-width:80ch}

/* Toast and modal */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#FAFAFA;border-radius:12px;padding:12px 16px;font-size:14px;display:flex;gap:16px;align-items:center;transition:opacity .3s,transform .3s var(--ease);z-index:60;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--gold);font-weight:700;cursor:pointer;padding:0}
.modal{position:fixed;inset:0;background:rgba(13,13,13,.34);display:grid;place-items:center;z-index:70;padding:16px}
.modal[hidden]{display:none}
.modal-box{background:#fff;border-radius:18px;padding:26px;max-width:440px;width:100%;border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(0,0,0,.4)}
.modal-box h3{font-family:var(--display);font-weight:400;font-size:17px;margin:0 0 10px;letter-spacing:.02em}
.modal-box p{margin:0 0 20px;color:var(--ink-2)}
.modal-box .row{justify-content:flex-end}

@media (max-width:1180px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .ledger{position:static}
}
@media (max-width:900px){
  .fgrid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip{grid-template-columns:1fr}
  .top-prop{display:none}
}
@media (max-width:640px){
  .meta{grid-template-columns:minmax(0,1fr)}
  .meta div{grid-template-columns:140px minmax(0,1fr)}
  .fgrid,.fgrid.c3,.fgrid.c4{grid-template-columns:minmax(0,1fr)}
  .fld.span2{grid-column:auto}
  .panel{padding:22px 18px;border-radius:18px}
  .hero{grid-template-columns:1fr;gap:12px}
  .core{width:170px;height:170px}
  .topbar{padding:10px 16px}
  .brand-sub{display:none}
  .stage,.rail{padding-left:16px;padding-right:16px}
  .lib-row{grid-template-columns:minmax(0,1fr)}
  .lib-amt{text-align:left}
  .sum-head{grid-template-columns:1fr}
  .kbd{display:none}
}
@media (prefers-reduced-motion:reduce){
  .track,.viewport,.rail ol::after,.yb-f{transition:none}
  .viewport::after{display:none}
  .slide.arrive .p-head>*{animation:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" style="fill:var(--ink)"/>
      <circle cx="32" cy="32" r="21" style="fill:none;stroke:#4A4741;stroke-width:3"/>
      <path d="M32 11 A21 21 0 0 1 53 32" style="fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round"/>
      <path d="M32 53 A21 21 0 0 1 14.8 44" style="fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;opacity:.55"/>
      <circle cx="32" cy="32" r="12" style="fill:none;stroke:var(--bg);stroke-width:2.5"/>
      <circle cx="32" cy="32" r="6" style="fill:var(--gold)"/>
    </svg>
    <div>
      <div class="brand-name">Proposal Budget<br>Builder</div>
      <div class="brand-sub">local unit · v1.0</div>
    </div>
  </div>
  <div class="top-prop">
    <div class="top-title" id="topTitle">Untitled proposal</div>
    <div class="save-state" id="saveState"><i></i><span>Saved in this browser</span></div>

/* One list of summary rows feeds the on-screen table, the copied table and the workbook. */
function summaryModel(P,R){
  const C=R.C, r=P.rates, rows=[];
  const sec=l=>rows.push({k:'sec',l});
  const ln=(id,l,v,k,extra)=>{ rows.push(Object.assign({k:k||'ln',id,l,v},extra||{})); return id; };
  const neg=a=>a.map(v=>-v);
  sec('Senior personnel');
  const sIds=R.L.senior.map((x,i)=>ln('sen'+i,`${x.name}, ${x.role}`,x.yrs.map(y=>y.sal)));
  if(!sIds.length) sIds.push(ln('sen-none','None budgeted',C.senior));
  ln('senSub','Subtotal senior personnel',C.senior,'sub',{parts:sIds});
  sec('Other personnel');
  ln('pd',`Postdoctoral researchers (${R.L.postdoc.length})`,C.postdoc);
  ln('gr',`Graduate research assistants (${R.L.grad.length})`,C.grad);
  ln('ug',`Undergraduate students (${R.ugradHeads})`,C.ugrad);
  ln('othSub','Subtotal other personnel',C.postdoc.map((v,k)=>v+C.grad[k]+C.ugrad[k]),'sub',{parts:['pd','gr','ug']});
  ln('sal','Total salaries & wages',R.salaries,'sub',{parts:['senSub','othSub']});
  ln('fr','Fringe benefits, faculty & postdocs',C.fringe);
  ln('frs',`Fringe benefits, students (${pctText(r.stuFringe)})`,C.fringeStu);
  ln('pers','Total personnel',R.personnel,'sub',{parts:['sal','fr','frs']});
  sec('Operating & other direct costs');
  ln('eq','Equipment',C.equip); ln('tr','Travel',C.travel); ln('ms','Materials & supplies',C.supplies); ln('pub','Publication costs',C.pubs);
  ln('intl','GRA international fees',C.intl); ln('tu','Tuition',C.tuition); ln('ins','GRA health insurance',C.insurance); ln('sub','Subawards',C.subs);
  const oIds=R.L.other.length?R.L.other.map((o,i)=>ln('oth'+i,o.name,o.vals)):[ln('oth-none','Other direct costs',C.other)];
  ln('tdc','Total direct costs',R.tdc,'tot',{parts:['pers','eq','tr','ms','pub','intl','tu','ins','sub',...oIds]});
  const ex=[];
  ex.push(ln('xeq','Less equipment',neg(C.equip),'neg',{negOf:'eq'}));
  ex.push(ln('xtu','Less tuition',neg(C.tuition),'neg',{negOf:'tu'}));
  if(r.exclInsurance) ex.push(ln('xins','Less GRA health insurance',neg(C.insurance),'neg',{negOf:'ins'}));
  if(r.exclIntl) ex.push(ln('xintl','Less GRA international fees',neg(C.intl),'neg',{negOf:'intl'}));
  if(R.L.subs.length) ex.push(ln('xsub',`Less subaward amounts beyond the first ${capText(R)} of each`,neg(R.exSub),'neg'));
  R.L.other.forEach((o,i)=>{ if(o.excl) ex.push(ln('xoth'+i,`Less ${o.name}`,neg(o.vals),'neg',{negOf:'oth'+i})); });
  ln('mtdc','Modified total direct costs (MTDC)',R.mtdc,'sub',{parts:['tdc',...ex]});
  ln('idc',`Indirect costs at ${pctText(r.idc)} of MTDC`,R.idc,'ln',{idcOf:'mtdc'});
  ln('tot','Total project cost',R.total,'grand',{parts:['tdc','idc']});
  ln('cum','Cumulative total',R.cum,'cum',{cumOf:'tot'});
  return rows;
}

    h+=`<tr class="o ${row.cls||''}${j===0?' first':''}"><th scope="row">${row.label}</th>`;
    per.forEach((p,k)=>{ h+=`<td data-out="${list}.${i}.${row.key}.${k}" data-fmt="${row.fmt}"></td>`; });
    h+='</tr>';
  });
  h+='</tbody></table></div>';

  return h;
}

function personCard(list,i,p){
  const isPI=list==='senior'&&i===0;
  let chip;
  if(isPI) chip='<span class="chip">PI</span>';
  else if(list==='senior') chip=`<div class="inp sel mini"><select id="senior-${i}-role" data-bind="senior.${i}.role" data-kind="text" aria-label="Role">${['Co-PI','Senior personnel'].map(o=>`<option${p.role===o?' selected':''}>${o}</option>`).join('')}</select></div>`;
  else chip='<span class="chip">Postdoc</span>';
  const top=`<div class="card-top">${chip}<span class="card-sum">All years<b data-out="${list}.${i}.tot" data-fmt="money"></b></span>${isPI?'':`<button class="icon-btn" type="button" data-act="remove" data-list="${list}" data-i="${i}">Remove</button>`}</div>`;
  const ph=list==='senior'?`${num(P.rates.fringe)}`:`${blankOr(P.rates.postdocFringe,num(P.rates.fringe))}`;
  const fields=list==='senior'
    ?`<div class="fgrid c4">${F({label:'Name',bind:isPI?'info.pi':`senior.${i}.name`,id:`senior-${i}-name`,req:isPI,ph:'Full name'})}${F({label:'Base salary',bind:`senior.${i}.salary`,kind:'money',hint:`${+p.appt===12?'12-month':'9-month'} salary, FY${R.baseFY}`})}${F({label:'Appointment',bind:`senior.${i}.appt`,options:[['9','9-month academic'],['12','12-month calendar']]})}${F({label:'Fringe override',bind:`senior.${i}.fringe`,kind:'pct',ph:ph,hint:'Blank uses the rate step'})}</div>`
    :`<div class="fgrid c3">${F({label:'Name or placeholder',bind:`postdocs.${i}.name`,ph:'e.g. Postdoc (TBD)'})}${F({label:'Annual salary',bind:`postdocs.${i}.salary`,kind:'money',hint:`12-month, FY${R.baseFY}`})}${F({label:'Fringe override',bind:`postdocs.${i}.fringe`,kind:'pct',ph:ph,hint:'Blank uses the postdoc rate'})}</div>`;
  const byAmt=list==='senior'&&p.mode==='amount';
  const modeRow=list==='senior'?`<div class="moderow"><div class="fld"><label class="fld-l" for="senior-${i}-mode">Enter salary as</label><div class="inp sel"><select id="senior-${i}-mode" data-bind="senior.${i}.mode" data-kind="text" data-rerender="1"><option value="effort"${byAmt?'':' selected'}>Effort percentages</option><option value="amount"${byAmt?' selected':''}>Dollar amount per year</option></select></div></div><p class="fld-h">${byAmt?'Type the salary you want each year. Academic effort stays as entered (1% by default), and the summer effort needed to reach the amount is worked out for you.':'Type academic and summer effort. Switch to a dollar amount when you know the salary you want to request.'}</p></div>`:'';
  const outs=[{label:'Academic months',key:'pma',fmt:'mo',cls:'sub'},{label:'Summer months',key:'pms',fmt:'mo',cls:'sub'},{label:'Salary',key:'sal',fmt:'money'},{label:'Fringe benefits',key:'fr',fmt:'money'},{label:'Total, salary + fringe',key:'tsum',fmt:'money',cls:'tot'}];
  const grid=byAmt
    ?gridTable(list,i,{arr:'effort',fill:'effort,amt',inputs:[{label:'Academic effort',field:'a',suf:'%'},{label:'Salary requested',arr:'amt',field:null,pre:'$',kind:'money'}],outputs:[{label:'Summer effort (worked out)',key:'seff',fmt:'pct2'},...outs]})
    :gridTable(list,i,{arr:'effort',inputs:[{label:'Academic effort',field:'a',suf:'%'},{label:'Summer effort',field:'s',suf:'%'}],outputs:outs});
  return `<article class="card" id="card-${list}-${i}">${top}${fields}${modeRow}${grid}</article>`;
}

function recompute(){
  R=calc(P);
  $$('[data-out]').forEach(el=>{ const v=R.out[el.dataset.out]; el.textContent=fmtOut(v,el.dataset.fmt); if(el.dataset.fmt==='chip') el.dataset.state=v||''; });
  $$('[data-href]').forEach(a=>{ const v=String(getPath(P,a.dataset.href)||'').trim(); const ok=/^https?:\/\//i.test(v); a.hidden=!ok; if(ok) a.href=v; });
  $$('[data-live]').forEach(el=>{ const fn=LIVE[el.dataset.live]; if(fn) el.innerHTML=fn(R); });
  $('#topTitle').textContent=P.info.title||'Untitled proposal';
  $('#navTotal').textContent=money(sumArr(R.total));
  scheduleSave();
}
function renderPanel(i){ slides[i].querySelector('.panel').innerHTML=RENDER[STEPS[i].id](); alignLabels(slides[i]); }
/* Labels that wrap to two lines push their box down. Give the labels in one grid row the same height so the boxes line up. */
function alignLabels(root){
  const grids=[]; (root?[root]:slides).forEach(sl=>sl.querySelectorAll('.fgrid').forEach(g=>grids.push(g)));
  const sets=grids.map(g=>[...g.children].filter(c=>c.classList.contains('fld')).map(f=>({f,l:f.querySelector(':scope>.fld-l')})).filter(x=>x.l));
  sets.forEach(set=>set.forEach(x=>{ x.l.style.minHeight=''; }));
  const plan=[];

/* Read a pasted date: 06/04/2027, 6/4/27, 2027-06-04, 06-04-2027, 06.04.2027, 20270604, June 4, 2027, 4 Jun 2027.
   Slashed dates are month first, as in the US. A trailing time such as "0:00" (copied from Excel) is ignored. */
function parseDateText(txt){
  let t=String(txt||'').trim().replace(/\s+/g,' ');
  t=t.replace(/[ T]\d{1,2}:\d{2}(:\d{2}(\.\d+)?)?( ?[AaPp]\.?[Mm]\.?)?Z?$/,'').trim();
  const MONS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const mon=w=>{ const k=MONS.indexOf(String(w).toLowerCase().slice(0,3)); return k<0?0:k+1; };
  let y,m,d,x;
  if((x=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})$/.exec(t))){ m=+x[1]; d=+x[2]; y=+x[3]; if(x[3].length===2) y+=2000; }
  else if((x=/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/.exec(t))){ y=+x[1]; m=+x[2]; d=+x[3]; }
  else if((x=/^(\d{8})$/.exec(t))){ const s8=x[1]; if(/^(19|20|21)/.test(s8)&&+s8.slice(4,6)<=12){ y=+s8.slice(0,4); m=+s8.slice(4,6); d=+s8.slice(6); } else { m=+s8.slice(0,2); d=+s8.slice(2,4); y=+s8.slice(4); } }
  else if((x=/^(?:[A-Za-z]+,? )?([A-Za-z]{3,9})\.? (\d{1,2})(?:st|nd|rd|th)?,? (\d{4})$/.exec(t))){ m=mon(x[1]); d=+x[2]; y=+x[3]; }
  else if((x=/^(\d{1,2}) ([A-Za-z]{3,9})\.?,? (\d{4})$/.exec(t))){ d=+x[1]; m=mon(x[2]); y=+x[3]; }
  else return null;
  if(!(y>=1900&&y<=2200&&m>=1&&m<=12&&d>=1)) return null;
  if(d>new Date(Date.UTC(y,m,0)).getUTCDate()) return null;
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

    const lit=Math.floor(t*4)%12;
    for(let i=0;i<12;i++){ const a=i/12*Math.PI*2-Math.PI/2; ctx.fillStyle=i===lit?gold:line; ctx.globalAlpha=i===lit?1:.9; ctx.beginPath(); ctx.arc(c+Math.cos(a)*(rIn-12),c+Math.sin(a)*(rIn-12),i===lit?3.2:2,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
    const pulse=REDUCED?0.5:(Math.sin(t*1.8)+1)/2;
    ctx.save(); ctx.shadowColor=gold; ctx.shadowBlur=14+14*pulse;
    const lg=ctx.createRadialGradient(c-6,c-6,2,c,c,rIn*.42); lg.addColorStop(0,'#F3E3BF'); lg.addColorStop(.55,gold); lg.addColorStop(1,deep);
    ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(c,c,rIn*.4,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.fillStyle='#FFFFFF'; ctx.globalAlpha=.85; ctx.beginPath(); ctx.arc(c-rIn*.13,c-rIn*.13,rIn*.07,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
    if(!REDUCED&&step===0) coreRAF=requestAnimationFrame(draw);
  };
  if(REDUCED) draw(performance.now()); else coreRAF=requestAnimationFrame(draw);
}

/* ---------- boot ---------- */
function boot(hot){
  buildShell();
  store=(hot&&hot.store)||loadStore();
  if(!store||!Array.isArray(store.proposals)||!store.proposals.length) store={proposals:[exampleProposal()],currentId:null,step:0};
  store.proposals.forEach(normalize);
  P=store.proposals.find(p=>p.id===store.currentId)||store.proposals[0];
  store.currentId=P.id;
  step=(hot&&typeof hot.step==='number')?hot.step:(typeof store.step==='number'?store.step:0);
  R=calc(P);
  renderAll();
  goTo(step,{instant:true});
  paintSaveState();
  let alignT=0;
  window.addEventListener('resize',()=>{ alignLabels(slides[step]); syncHeight(); if(step===0) startCore(); clearTimeout(alignT); alignT=setTimeout(()=>alignLabels(),200); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ alignLabels(); syncHeight(); });
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot) window.claude.hot.snapshot(()=>({store:JSON.parse(JSON.stringify(store)),step}));
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
